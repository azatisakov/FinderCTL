[project]
name = "finderctl"
version = "1.0.0"
description = "FinderCTL — manage macOS Finder preferences safely"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "zeefiles", email = "zeefiles@example.com" },
]
dependencies = [
    "typer>=0.12",
    "ds-store>=1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
]

[project.scripts]
finderctl = "finderctl.cli:app"

[tool.setuptools.packages.find]
include = ["finderctl*"]
exclude = ["samples*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"finderctl/cli.py" = ["B008"]

[tool.ruff.format]
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["ds_store.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finderctl --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["finderctl"]
branch = true
